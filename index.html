<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ece8df">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>USB Dodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header id="topbar">
    <div id="brand">
      <svg id="mark" viewBox="0 0 28 20" aria-hidden="true">
        <rect x="1" y="1" width="26" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="5" y="11" width="18" height="4" fill="currentColor"/>
        <rect x="8" y="5" width="3" height="3" fill="currentColor"/>
        <rect x="17" y="5" width="3" height="3" fill="currentColor"/>
      </svg>
      <span id="logo">USB Dodge</span>
    </div>
    <span id="model">Model UD-8 &middot; Type-A receptacle, uncooperative</span>
    <div id="topbtns">
      <button id="btn-pause" class="iconbtn" title="Pause (P)" aria-label="Pause game (P)" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3" height="12" fill="currentColor"/><rect x="12" y="4" width="3" height="12" fill="currentColor"/></svg>
      </button>
      <button id="btn-mute" class="iconbtn" title="Sound (M)" aria-label="Mute (M)">
        <svg class="ic-on" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8v4h3l4 3.5v-11L6 8z" fill="currentColor"/>
          <path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <svg class="ic-off" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 8v4h3l4 3.5v-11L6 8z" fill="currentColor"/>
          <path d="M13 7.5l5 5M18 7.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </button>
      <button id="btn-help" class="iconbtn" title="Help" aria-label="Help">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7.4 7.6a2.6 2.6 0 1 1 3.8 2.3c-.9.5-1.2 1-1.2 1.9v.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <rect x="9" y="14" width="2" height="2" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="hud" class="hidden">
    <div class="cell cell-level"><span class="lbl">Level</span><span class="val" id="hud-level"></span></div>
    <div class="cell cell-time">
      <span class="lbl">Time</span><span class="val" id="hud-time">30.0</span>
      <div id="timebar" title="Time remaining"><div id="timefill"></div></div>
    </div>
    <div class="cell"><span class="lbl">Dodges</span><span class="val" id="hud-miss">0</span></div>
    <div class="cell"><span class="lbl">Score</span><span class="val" id="hud-score">0</span></div>
    <div class="cell"><span class="lbl">Ports</span><span class="val" id="hud-ports"></span></div>
    <div class="cell" id="hud-flip" style="display:none"><span class="lbl">Spare</span><span class="val">Flip-flop</span></div>
    <div class="cell" id="hud-seal" style="display:none"><span class="lbl">Reclaim</span><span class="val">0/3</span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="USB Dodge game. Move with arrow keys or drag. Pause with P."></canvas>
    <div id="overlay"></div>
  </div>
  <div id="touch-controls" data-mode="slide" aria-label="Touch controls">
    <p id="touch-hint">Drag to slide, or hold an arrow.</p>
    <div class="touch-arrows"><button data-direction="-1" aria-label="Move left"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button><button data-direction="1" aria-label="Move right"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button></div>
    <div class="touch-slots"><button data-slot="0" aria-label="Jump to slot 1">1</button><button data-slot="1" aria-label="Jump to slot 2">2</button><button data-slot="2" aria-label="Jump to slot 3">3</button><button data-slot="3" aria-label="Jump to slot 4">4</button><button data-slot="4" aria-label="Jump to slot 5">5</button></div>
  </div>
  <ol class="level-track" aria-label="Campaign levels"><!-- rendered from LEVELS in main.js --></ol>
  <footer id="foot">
    <div id="foot-keys"><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>Space</kbd> confirm &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> sound</div>
    <div id="foot-os"></div>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
