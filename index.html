<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#111310">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>USB DODGE — a tiny game about not getting plugged</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header id="topbar">
    <div id="brand" aria-label="USB DODGE">
      <svg id="mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="7.5" width="17" height="9.5" rx="2.4" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M7.5 11.5h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </svg>
      <div id="logo">USB<em>DODGE</em></div>
    </div>
    <div id="hud" class="hidden">
      <div class="pill"><span class="pill-lbl">LV</span><span id="hud-level">1 · FIRST BOOT</span></div>
      <div class="pill">
        <svg class="pill-ic" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8v4.2l3 2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="hud-time">30.0s</span>
      </div>
      <div class="pill"><span class="pill-lbl">MISS</span><span id="hud-miss">○○○○○</span></div>
      <div class="pill"><span class="pill-lbl">SCORE</span><span id="hud-score">0</span></div>
      <div class="pill ports"><span id="hud-ports">●</span></div>
      <div class="pill" id="hud-flip" style="display:none">⟲ +1 FLIP</div>
    </div>
    <div id="topbtns">
      <button id="btn-pause" class="iconbtn" title="Pause / resume (P)" aria-label="Pause game (P)" disabled>Ⅱ</button>
      <button id="btn-mute" class="iconbtn" title="Mute (M)" aria-label="Mute (M)">
        <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5v5h3.2L12 18.5V5.5l-4.8 4H4z" fill="currentColor"/>
          <path d="M15.3 8.6a4.8 4.8 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M17.9 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5v5h3.2L12 18.5V5.5l-4.8 4H4z" fill="currentColor"/>
          <path d="M15.5 9.3l5.2 5.4M20.7 9.3l-5.2 5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-help" class="iconbtn" title="Help" aria-label="Help">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.3 9.2a2.7 2.7 0 1 1 3.9 2.4c-1 .5-1.6 1.2-1.6 2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="11.6" cy="16.8" r="1.3" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="arcade-label"><span><i></i> THE ANTI-CONNECTION ARCADE</span><span>EST. 2026 · SINGLE PLAYER</span></div>
  <div id="stage">
    <div id="timebar" title="Time remaining"><div id="timefill"></div></div>
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="USB Dodge game. Move with arrow keys or drag. Pause with P."></canvas>
    <div id="overlay"></div>
  </div>
  <div id="touch-controls" data-mode="slide" aria-label="Touch controls">
    <p id="touch-hint">Drag to slide, or hold an arrow.</p>
    <div class="touch-arrows"><button data-direction="-1" aria-label="Move left">←</button><button data-direction="1" aria-label="Move right">→</button></div>
    <div class="touch-slots"><button data-slot="0" aria-label="Jump to slot 1">1</button><button data-slot="1" aria-label="Jump to slot 2">2</button><button data-slot="2" aria-label="Jump to slot 3">3</button><button data-slot="3" aria-label="Jump to slot 4">4</button><button data-slot="4" aria-label="Jump to slot 5">5</button></div>
  </div>
  <div class="level-track" aria-label="Campaign levels"><span>01 <b>First boot</b></span><span>02 <b>Cornered</b></span><span>03 <b>Double trouble</b></span><span>04 <b>Two hands</b></span><span>05 <b>Blackout</b></span></div>
  <footer id="foot">
    <div id="foot-keys">A/D or ←/→ to move · Space to confirm · P pause · M mute</div>
    <div id="foot-os"></div>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
